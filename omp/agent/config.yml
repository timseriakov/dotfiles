mcp:
  enableProjectConfig: true
skills:
  enableClaudeUser: false
  enableClaudeProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
astGrep:
  enabled: true
startup:
  quiet: false
theme:
  dark: starship-nord
colorBlindMode: false
showHardwareCursor: false
stt:
  enabled: true
  language: ru

compaction:
  enabled: true
  strategy: context-full
  thresholdPercent: 60
  keepRecentTokens: 30000
  midTurnEnabled: true
  idleEnabled: true
  idleThresholdTokens: 150000
  idleTimeoutSeconds: 180
statusLine:
  preset: custom
  separator: none
  leftSegments:
    - path
    - git
    - mode
    - context_pct
    - model
  rightSegments:
    - session_name
  segmentOptions:
    path:
      abbreviate: false
      maxLength: 32
      stripWorkPrefix: true
      lastSegment: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
      compactDirty: true
      showAheadBehind: true
    model:
      showThinkingLevel: false
  sessionAccent: false
  showHookStatus: false
modelRoles:
  default: omniroute/cx/gpt-5.5-medium:medium
  smol: omniroute/opencode-zen/deepseek-v4-flash-free
  slow: omniroute/cx/gpt-5.5-high:high
  plan: omniroute/cx/gpt-5.5-high:high
  task: omniroute/cx/gpt-5.5-medium:medium
  vision: omniroute/cx/gpt-5.5-medium:medium
  tiny: omniroute/cx/gpt-5.6-luna:off
  advisor: omniroute/cx/gpt-5.5:high
  commit: omniroute/opencode-zen/deepseek-v4-flash-free
