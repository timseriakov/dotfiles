debug: false
yolo: false
max_context_size: 100000
max_capture_lines: 1000
wait_interval: 2

default_model: fast

models:
  fast:
    provider: openai
    model: "opencode-zen/deepseek-v4-flash-free"
    api_key: "${OMNIROUTE_TMUX_AI_API_KEY}"
    base_url: "https://router.hwqtpa.easypanel.host/v1"
  smart:
    provider: openai
    model: "cx/gpt-5.6-luna"
    api_key: "${OMNIROUTE_TMUX_AI_API_KEY}"
    base_url: "https://router.hwqtpa.easypanel.host/v1"

exec_confirm: true
send_keys_confirm: true
paste_multiline_confirm: true

knowledge_base:
  auto_load:
    - terminal-macos-fish.md
